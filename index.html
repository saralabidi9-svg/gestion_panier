    <link rel="stylesheet" href="index.css">
</head>

<body>

    <header>
        <h1>Gestion de panier</h1>
      <nav>
    <a href="index.html">Accueil</a>
    <a href="#produits">Produits</a>
    <a href="panier.html">Mon panier</a>
    <a href="contact.html">Contact</a>
</nav>

    </header>

    <main>
        <h2>Liste des produits</h2>

       <section class="produits" id="produits"></section>

           <section class="produits">

    <div class="produit">
        <img src="https://placehold.co/200x150?text=Produit+1" alt="Produit 1">
        <h3>Produit 1</h3>
        <p>Prix : 20 DT</p>
        <button>Ajouter au panier</button>
    </div>

    <div class="produit">
        <img src="https://placehold.co/200x150?text=Produit+2" alt="Produit 2">

        <p>Prix : 35 DT</p>
        <button>Ajouter au panier</button>
    </div>

    <div class="produit">
        <img src="https://placehold.co/200x150?text=Produit+3" alt="Produit 3">
        <h3>Produit 3</h3>
        <p>Prix : 15 DT</p>
        <button>Ajouter au panier</button>
    </div>

</section>

        <h2>Mon panier</h2>

        <section class="panier">
            <p>Aucun produit dans le panier.</p>
            <h3>Total : 0 DT</h3>
            <a href="confirmation.html" class="btn">Valider la commande</a>
        </section>

    </main>
